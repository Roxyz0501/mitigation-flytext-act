name: build-and-release
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Download official ACT
        shell: pwsh
        run: Invoke-WebRequest 'https://advancedcombattracker.com/download.php?id=57' -OutFile act.zip
      - name: Extract ACT
        shell: pwsh
        run: Expand-Archive act.zip act
      - name: Build and test
        shell: pwsh
        run: .\build.ps1 -ActPath (Resolve-Path '.\act\Advanced Combat Tracker.exe')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/MitigationFlytext-v*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist
      - name: Verify tag and assets
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if (-not (Test-Path "dist/MitigationFlytext-v$version.zip")) { throw 'Versioned ZIP is missing.' }
          if (-not (Test-Path "dist/MitigationFlytext-v$version.sha256")) { throw 'SHA-256 manifest is missing.' }
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ github.ref_name }}' dist/* --verify-tag --generate-notes --title '${{ github.ref_name }}'
